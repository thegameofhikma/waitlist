kind = "web"
previewPath = "/"
title = "Islamic Golden Age Board Game — Waitlist"
version = "1.0.0"
id = "artifacts/waitlist"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26025

[services.development]
run = "pnpm --filter @workspace/waitlist run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/waitlist", "run", "build" ]
publicDir = "artifacts/waitlist/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26025"
BASE_PATH = "/"
